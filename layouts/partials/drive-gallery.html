{{ if .Site.Params.driveGallery.enabled }}
<section style="margin-top:2rem;">
  <h2 style="margin-bottom:1rem;">
    {{ .Site.Params.driveGallery.title }}
  </h2>

  <div style="
    width:100%;
    overflow:hidden;
    border-radius:16px;
    border:1px solid rgba(128,128,128,0.2);
    box-shadow:0 10px 30px rgba(0,0,0,0.12);
  ">
    <iframe
      src="https://drive.google.com/embeddedfolderview?id={{ .Site.Params.driveGallery.folderId }}#grid"
      style="
        width:100%;
        height:75vh;
        min-height:500px;
        border:0;
        display:block;
      "
      loading="lazy">
    </iframe>
  </div>
</section>
{{ end }}
